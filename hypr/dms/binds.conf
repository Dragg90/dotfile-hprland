################################
# SCREENSHOTS
################################

# Menú general de capturas (tu "Print" moderno)
bind = SUPER, P, exec, dms screenshot

# Pantalla completa directa no reconoce p
#bind = SUPER, SHIFT, P, exec, dms screenshot full


################################
# LANZADORES BÁSICOS / UTILIDADES
################################

# Terminal
bind = SUPER, Return, exec, kitty # kitty

# Navegador
bind = SUPER, B, exec, brave # Brave

# Explorador de archivos
bind = SUPER, E, exec, dolphin # dolphin

# Cerrar ventana activa
bind = SUPER, Q, killactive

# Fullscreen
bind = SUPER, F, fullscreen, 1

# Toggle floating de la ventana activa (útil para launchers / juegos)
bind = SUPER, T, togglefloating

# Togglegroup
bind = SUPER, G, togglegroup

# Portapapeles (clipboard)
bind = SUPER, V, exec, dms ipc call clipboard toggle

# Menú de energía (power menu)
bind = SUPER, X, exec, dms ipc call powermenu toggle

# Lock screen
bind = SUPER ALT, L, exec, dms ipc call lock lock

# "Ctrl+Alt+Del" moderno: lista de procesos
bind = CTRL ALT, Delete, exec, dms ipc call processlist focusOrToggle

# Cambio de layout dwindle/scrolling
bind = SUPER, L, exec, ~/.config/hypr/scripts/toggle-layout.sh


################################
# DMS / OVERLAYS / WIDGETS
################################

# Renombrar workspace
bind = CTRL SHIFT, R, exec, dms ipc call workspace-rename open

# Overlay de keybinds
bind = SUPER SHIFT, K, exec, dms ipc call keybinds toggle hyprland

# Notificaciones
bind = SUPER, N, exec, dms ipc call notifications toggle

# Cambiar wallpaper
bind = SUPER, W, exec, dms ipc call dankdash wallpaper

# Configuración / Settings
bind = SUPER, C, exec, dms ipc call settings focusOrToggle

# Launcher (spotlight / apps)
bind = SUPER, SPACE, exec, dms ipc call spotlight toggle


################################
# WORKSPACES
################################

# Workspaces directos (1-9)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Mover ventana al workspace (1-9)
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Workspaces relativos (tipo pestañas)
bind = SUPER CTRL, left,  workspace, e-1
bind = SUPER CTRL, right, workspace, e+1

# Mover ventana a workspace relativo
bind = SUPER CTRL SHIFT, left,  movetoworkspace, e-1
bind = SUPER CTRL SHIFT, right, movetoworkspace, e+1

# Alt+Tab estilo Win+Tab para ver todas las ventanas en todos los workspace (overview de DMS)
bind = ALT, TAB, exec, dms ipc call hypr toggleOverview


################################
# NAVEGACIÓN ENTRE VENTANAS (FLECHAS)
################################

# Mover foco entre ventanas
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

# Mover ventana dentro del workspace
bind = SUPER SHIFT, left,  movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up,    movewindow, u
bind = SUPER SHIFT, down,  movewindow, d


################################
# MONITORES
################################

# Cambiar foco de monitor
bind = SUPER ALT, left,  focusmonitor, l
bind = SUPER ALT, right, focusmonitor, r

# Mover ventana a otro monitor
bind = SUPER ALT SHIFT, left,  movewindow, mon:l
bind = SUPER ALT SHIFT, right, movewindow, mon:r


################################
# RESIZE DE VENTANAS
################################

# Resize horizontal
binde = SUPER, minus, resizeactive, -10% 0
binde = SUPER, equal, resizeactive, 10% 0   # opcional: agrandar

# Resize vertical
binde = SUPER SHIFT, minus, resizeactive, 0 -10%
binde = SUPER SHIFT, equal, resizeactive, 0 10%  # opcional: agrandar


################################
# MOUSE + SUPER
################################

bindmd = SUPER, mouse:272, movewindow
bindmd = SUPER, mouse:273, resizewindow


################################
# RELOAD
################################

# Recargar Hyprland
bind = SUPER, Home, exec, hyprctl reload

# Reiniciar DMS (usa el mismo comando que el servicio systemd)
bind = SUPER, End, exec, systemctl --user restart dms.service
